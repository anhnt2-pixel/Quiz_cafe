```html id="quizcoffeepro"
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Test tính cách Coffee</title>

<style>
body{
font-family:Arial;
background:#f3e5d8;
display:flex;
justify-content:center;
padding:30px;
}

.container{
background:white;
width:700px;
padding:30px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

h1{
text-align:center;
color:#5d4037;
}

.question{
margin:20px 0;
}

.answers label{
display:block;
padding:8px;
cursor:pointer;
border-radius:6px;
}

.answers label:hover{
background:#ffe0b2;
}

button{
width:100%;
padding:12px;
background:#6d4c41;
color:white;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

.result{
margin-top:20px;
text-align:center;
}

iframe{
width:100%;
height:500px;
border:none;
}
</style>

</head>

<body>

<div class="container">

<h1>☕ Test tính cách Coffee</h1>
<p>Cùng khám phá bạn là “nhà bác học cà phê” nào!</p>

<form id="quiz"></form>

<button onclick="submitQuiz()">Xem kết quả</button>

<div class="result" id="result"></div>

</div>

<script>

const questions = [
"1. Một buổi sáng lý tưởng của bạn là:",
"2. Khi đi cà phê với bạn bè, bạn thường:",
"3. Bạn chọn không gian làm việc như thế nào?",
"4. Khi chọn đồ uống:",
"5. Khi làm việc nhóm, bạn là người:",
"6. Một ngày hoàn hảo với bạn là:",
"7. Bạn thích ly cà phê của mình:",
"8. Bạn thường được bạn bè nhận xét:",
"9. Khi đứng trước lựa chọn khó:",
"10. Nếu cuộc sống là một phản ứng:"
];

const answers = [
["Chậm rãi","Đúng giờ","Ý tưởng mới"],
["Chia sẻ","Quan sát","Tạo trò vui"],
["Ấm cúng","Tối giản","Sáng tạo"],
["Dễ uống","Phù hợp","Thử mới"],
["Kết nối","Đảm bảo","Ý tưởng"],
["Bình yên","Hiệu quả","Thú vị"],
["Nhẹ nhàng","Cân bằng","Mới lạ"],
["Tình cảm","Đáng tin","Khác biệt"],
["Dễ chịu","Hợp lý","Lối riêng"],
["Êm ái","Ổn định","Bùng nổ"]
];

const form = document.getElementById("quiz");

questions.forEach((q,i)=>{
let html = `<div class="question"><p>${q}</p><div class="answers">`;

["A","B","C"].forEach((letter,j)=>{
html += `
<label>
<input type="radio" name="q${i}" value="${letter}">
${letter}. ${answers[i][j]}
</label>`;
});

html += `</div></div>`;
form.innerHTML += html;
});

function submitQuiz(){

let count={A:0,B:0,C:0};
let lastAnswer=null;

for(let i=0;i<10;i++){
let q=document.querySelector(`input[name="q${i}"]:checked`);

if(!q){
alert("Vui lòng trả lời hết 10 câu!");
return;
}

count[q.value]++;

if(i===9){ // câu 10
lastAnswer=q.value;
}
}

// tìm max
let max = Math.max(count.A,count.B,count.C);

// kiểm tra hòa
let resultType;

let arr=[];
for(let key in count){
if(count[key]===max){
arr.push(key);
}
}

if(arr.length===1){
resultType=arr[0];
}else{
resultType=lastAnswer; // dùng câu 10
}

// map kết quả
const resultMap={
A:{
name:"The Sweet Scientist 🍶",
file:"KQ1.pdf"
},
B:{
name:"The Classic Chemist ☕",
file:"KQ2.pdf"
},
C:{
name:"The Creative Reactor 🧪",
file:"KQ3.pdf"
}
};

let result=resultMap[resultType];

document.getElementById("result").innerHTML = `
<h2>${result.name}</h2>
<iframe src="${result.file}"></iframe>
`;

}

</script>

</body>
</html>
```
